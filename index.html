<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strive Internal Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--font-display:'DM Serif Display',Georgia,serif;--font-body:'DM Sans','Helvetica Neue',sans-serif;--btc:#F7931A;--btc-dim:rgba(247,147,26,0.13);--bg:#0A0A0A;--surface:#141414;--surface-2:#1C1C1C;--surface-3:#242424;--border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.13);--text:#ECECEC;--text-muted:#888;--text-faint:#444;--green:#3ECF8E;--blue:#4D9DE0;--yellow:#FFD23F;--yellow-dim:rgba(255,210,63,0.14);--red:#F1565F;--red-dim:rgba(241,86,95,0.13);--green-dim:rgba(62,207,142,0.12);--blue-dim:rgba(77,157,224,0.11);--radius-sm:5px;--radius-md:9px;--radius-lg:15px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-size:16px;}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
.header{flex-shrink:0;border-bottom:1px solid var(--border);padding:11px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--bg);}
.logo{display:flex;align-items:center;gap:11px;}
.logo-text{font-family:var(--font-display);font-size:1.25rem;line-height:1;}
.logo-text span{display:block;font-family:var(--font-body);font-size:0.63rem;font-weight:500;color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase;margin-top:3px;}
.year-nav{display:flex;align-items:center;gap:16px;}
.year-nav span{font-family:var(--font-display);font-size:1.6rem;min-width:80px;text-align:center;}
.year-nav button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-muted);transition:background .15s,color .15s;}
.year-nav button:hover{background:var(--surface-3);color:var(--text);}
.btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--btc);color:#0A0A0A;font-weight:700;font-size:0.9rem;padding:10px 18px;border-radius:var(--radius-sm);transition:background .15s;}
.btn-add:hover{background:#ffa33d;}
/* TOOLBAR — filter chips, search and tools share one row so the calendar keeps its height */
.toolbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px 28px;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap;}
.legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.tool-right{display:flex;align-items:center;gap:9px;margin-left:auto;flex-wrap:wrap;}
.legend-item{display:inline-flex;align-items:center;gap:8px;font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);transition:background .15s,border-color .15s,color .15s,opacity .15s;}
.legend-item:hover{border-color:var(--border-hi);color:var(--text);}
.legend-item.off{opacity:.38;}
.legend-item.off .legend-dot{background:var(--text-faint)!important;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.legend-n{font-size:0.66rem;color:var(--text-faint);font-weight:700;}
.legend-count{font-size:0.73rem;color:var(--text-faint);white-space:nowrap;}
.btn-mini{display:inline-flex;align-items:center;gap:6px;font-size:0.68rem;font-weight:700;letter-spacing:0.03em;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.btn-mini:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-hi);}
.btn-mini.warn:hover{border-color:var(--red);color:var(--red);background:rgba(241,86,95,.08);}
/* SEARCH */
.search-wrap{position:relative;flex:1 1 220px;max-width:400px;min-width:170px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;display:flex;}
.search-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 34px 8px 37px;font:inherit;font-size:0.87rem;color:var(--text);transition:border-color .15s,box-shadow .15s;}
.search-input:focus{outline:none;border-color:var(--btc);box-shadow:0 0 0 3px rgba(247,147,26,0.10);}
.search-input::placeholder{color:var(--text-faint);}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-faint);transition:background .12s,color .12s;opacity:0;pointer-events:none;}
.search-clear.visible{opacity:1;pointer-events:all;}
.search-clear:hover{background:var(--surface-3);color:var(--text);}
.search-hint{font-size:0.72rem;color:var(--text-faint);}
/* SEARCH RESULTS */
.search-overlay{position:fixed;inset:0;z-index:350;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s;}
.search-overlay.open{opacity:1;pointer-events:all;}
.search-overlay-head{flex-shrink:0;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;}
.search-overlay-label{font-family:var(--font-display);font-size:1.5rem;flex:1;}
.search-overlay-label span{color:var(--text-muted);font-size:0.95rem;font-style:italic;margin-left:10px;}
.search-close-btn{display:inline-flex;align-items:center;gap:7px;color:var(--text-muted);font-size:0.85rem;font-weight:600;padding:8px 13px;border-radius:var(--radius-sm);transition:background .15s,color .15s;}
.search-close-btn:hover{background:var(--surface-2);color:var(--text);}
.search-results-body{flex:1;overflow-y:auto;padding:24px 28px 60px;}
.search-results-body::-webkit-scrollbar{width:7px;}
.search-results-body::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}
.search-results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:13px;max-width:1400px;margin:0 auto;}
.src-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px 17px;border-left:3px solid var(--c);cursor:pointer;transition:background .15s,transform .15s;}
.src-card:hover{background:var(--surface-2);transform:translateY(-1px);}
/* TYPE COLORS — each type sets --c (accent) and --cd (dim tint) */
.bitcoin{--c:var(--btc);--cd:var(--btc-dim);}
.milestone{--c:var(--yellow);--cd:var(--yellow-dim);}
.attending{--c:var(--green);--cd:var(--green-dim);}
.possible{--c:var(--red);--cd:var(--red-dim);}
.holiday{--c:var(--blue);--cd:var(--blue-dim);}
.src-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.src-date-lbl{font-size:0.67rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.src-title{font-weight:700;font-size:0.94rem;margin-bottom:5px;line-height:1.35;}
.src-notes{font-size:0.81rem;color:var(--text-muted);line-height:1.55;}
.src-notes mark,.src-title mark{background:rgba(247,147,26,0.22);color:var(--btc);border-radius:2px;padding:0 2px;}
.search-empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-faint);}
.search-empty h3{font-family:var(--font-display);font-size:1.4rem;color:var(--text-muted);margin-bottom:8px;}
/* VIEW SWITCHER + TODAY */
.view-tools{display:flex;align-items:center;gap:8px;}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;}
.seg button{display:inline-flex;align-items:center;gap:6px;font-size:0.76rem;font-weight:700;padding:7px 13px;border-radius:3px;color:var(--text-muted);transition:background .15s,color .15s;}
.seg button.on{background:var(--surface-3);color:var(--text);}
.seg button:hover:not(.on){color:var(--text);}
.btn-today{font-size:0.76rem;font-weight:700;padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-muted);transition:background .15s,color .15s,border-color .15s;}
.btn-today:hover{border-color:var(--btc);color:var(--btc);}
/* AGENDA VIEW */
.agenda{max-width:1000px;margin:0 auto;}
.ag-month{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 9px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);margin-bottom:13px;}
.ag-month h3{font-family:var(--font-display);font-size:1.55rem;line-height:1;}
.ag-month .ag-n{font-size:0.7rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-left:auto;}
.ag-group{margin-bottom:26px;}
.ag-row{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:13px 15px 13px 13px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:var(--radius-md);margin-bottom:9px;transition:background .14s,border-color .14s;}
.ag-row:hover{background:var(--surface-2);border-color:var(--border-hi);border-left-color:var(--c);}
.ag-row.past{opacity:.5;}
.ag-when{display:flex;flex-direction:column;gap:3px;}
.ag-dow{font-size:0.63rem;font-weight:800;color:var(--text-faint);letter-spacing:0.09em;text-transform:uppercase;}
.ag-dnum{font-family:var(--font-display);font-size:1.5rem;line-height:1;color:var(--text);}
.ag-range{font-size:0.66rem;font-weight:700;color:var(--c);letter-spacing:0.03em;}
.ag-main{min-width:0;}
.ag-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.ag-title{font-weight:700;font-size:1rem;line-height:1.35;margin-bottom:4px;}
.ag-notes{font-size:0.82rem;color:var(--text-muted);line-height:1.55;}
.ag-notes.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ag-more{font-size:0.7rem;font-weight:700;color:var(--btc);margin-top:4px;letter-spacing:0.03em;}
.ag-more:hover{text-decoration:underline;}
.ag-clash{display:inline-flex;align-items:center;gap:4px;font-size:0.6rem;font-weight:800;color:var(--red);letter-spacing:0.06em;text-transform:uppercase;background:rgba(241,86,95,.11);border:1px solid rgba(241,86,95,.3);padding:2px 7px;border-radius:3px;}
.ag-today-line{display:flex;align-items:center;gap:10px;margin:4px 0 13px;}
.ag-today-line span{font-size:0.62rem;font-weight:800;color:var(--btc);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
.ag-today-line i{flex:1;height:1px;background:var(--btc);opacity:.45;}
.ag-empty{text-align:center;padding:70px 20px;color:var(--text-faint);}
.ag-empty h3{font-family:var(--font-display);font-size:1.4rem;color:var(--text-muted);margin-bottom:8px;}
.ag-jump{font-size:0.66rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);padding:4px 9px;border-radius:var(--radius-sm);border:1px solid var(--border);transition:color .14s,border-color .14s,background .14s;}
.ag-jump:hover{color:var(--btc);border-color:var(--btc);background:var(--btc-dim);}
@media(max-width:600px){.ag-row{grid-template-columns:1fr;gap:8px;}.ag-when{flex-direction:row;align-items:baseline;gap:8px;}}
/* RELATIVE-TIME BADGE — "how soon is this?" at a glance */
.rel{display:inline-flex;align-items:center;font-size:0.61rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--surface-3);color:var(--text-muted);white-space:nowrap;}
.rel.now{background:var(--btc);color:#0A0A0A;}
.rel.soon{background:var(--btc-dim);color:var(--btc);}
.rel.gone{background:transparent;color:var(--text-faint);border:1px solid var(--border);}
/* Honesty note under the status toggle — the change is per-browser, not shared */
.local-note{display:block;margin-top:6px;font-size:0.64rem;line-height:1.45;color:var(--text-faint);max-width:46ch;}
/* SCROLL */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:28px 28px 60px;}
/* Month view is a fixed-height dashboard: the calendar and the event panel each
   manage their own scrolling, so the page itself must not scroll. */
.scroll.locked{overflow:hidden;padding:18px 28px;}
.scroll::-webkit-scrollbar{width:7px;}
.scroll::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;max-width:1600px;margin:0 auto;}
/* MONTH CARD */
.month{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;user-select:none;}
.month:hover{border-color:var(--btc);transform:translateY(-3px);box-shadow:0 8px 32px rgba(247,147,26,0.10);}
.month-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:8px;}
.month-name{font-family:var(--font-display);font-size:1.25rem;}
.month-tally{font-size:0.68rem;color:var(--btc);font-weight:700;white-space:nowrap;}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:5px;}
.weekdays div{text-align:center;font-size:0.62rem;color:var(--text-faint);font-weight:700;}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
.day{min-width:0;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;font-size:0.82rem;color:var(--text-muted);border:1px solid transparent;}
.day.empty{border:none;}
.day.event{color:var(--text);font-weight:600;border-color:var(--border);background:var(--surface-2);}
.day.today{background:var(--btc);color:#0A0A0A;font-weight:700;border-color:var(--btc);}
.day-dots{display:flex;gap:2px;margin-top:2px;}
.day-dots .d{width:4px;height:4px;border-radius:50%;}
.d{background:var(--c);}
.day.today .d{background:#0A0A0A;}
/* TOOLTIP */
.tooltip{position:fixed;z-index:400;background:var(--surface-3);border:1px solid var(--border-hi);border-radius:var(--radius-md);padding:10px 13px;max-width:270px;box-shadow:0 12px 32px rgba(0,0,0,.6);pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .12s,transform .12s;}
.tooltip.show{opacity:1;transform:translateY(0);}
.tooltip-row{display:flex;align-items:flex-start;gap:8px;}
.tooltip-row+.tooltip-row{margin-top:7px;padding-top:7px;border-top:1px solid var(--border);}
.tooltip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tooltip-title{font-size:0.82rem;font-weight:600;color:var(--text);line-height:1.3;}
.tooltip-notes{font-size:0.73rem;color:var(--text-muted);line-height:1.4;margin-top:2px;}
/* ── MONTH BAR — always-visible month navigation for the month view ── */
.monthbar{flex-shrink:0;display:none;align-items:center;gap:9px;padding:7px 28px;border-bottom:1px solid var(--border);background:var(--bg);}
.monthbar.on{display:flex;}
.mb-arrow{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-muted);transition:background .15s,color .15s,border-color .15s;}
.mb-arrow:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-hi);}
.mb-months{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
.mb-months::-webkit-scrollbar{display:none;}
.mb-m{flex:1;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;border-radius:var(--radius-sm);border:1px solid transparent;color:var(--text-faint);font-size:0.7rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;transition:background .14s,color .14s,border-color .14s;}
.mb-m:hover{background:var(--surface-2);color:var(--text);}
.mb-m em{font-style:normal;font-size:0.63rem;font-weight:700;color:var(--text-faint);letter-spacing:0;}
.mb-m.on{background:var(--surface-3);color:var(--text);border-color:var(--border-hi);}
.mb-m.on em{color:var(--btc);}
.mb-m.now:not(.on){color:var(--btc);}
/* ── MONTH VIEW — calendar grid and that month's events on one screen ── */
.month-view{height:100%;min-height:0;}
.mv-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;height:100%;min-height:0;max-width:1720px;margin:0 auto;}
.mv-cal{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px 15px 13px;}
.mv-cal-head{display:flex;align-items:baseline;gap:14px;margin-bottom:11px;flex-wrap:wrap;flex-shrink:0;}
.mv-cal-title{font-family:var(--font-display);font-size:1.6rem;line-height:1;}
.mv-glance{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;}
.mv-chip{display:inline-flex;align-items:center;font-size:0.63rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--cd);color:var(--c);}
.mv-chip.none{background:transparent;color:var(--text-faint);border:1px solid var(--border);}
.mv-wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px;flex-shrink:0;}
.mv-wdays div{text-align:center;font-size:0.65rem;color:var(--text-faint);font-weight:800;text-transform:uppercase;letter-spacing:0.09em;}
.mv-wdays div.we{opacity:.55;}
/* minmax(0,…) is required: pills are nowrap, and plain 1fr blows the columns out. */
.mv-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(78px,1fr);gap:5px;flex:1;min-height:0;overflow-y:auto;}
.mv-days::-webkit-scrollbar{width:6px;}
.mv-days::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}
.mv-day{min-width:0;overflow:hidden;border-radius:var(--radius-md);padding:5px 6px;border:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:3px;transition:border-color .14s,background .14s;}
.mv-day.we{background:rgba(255,255,255,.014);}
.mv-day.empty{background:transparent;border-color:transparent;}
.mv-day.has-event{cursor:pointer;}
.mv-day.has-event:hover{background:var(--surface-3);border-color:var(--border-hi);}
.mv-day.today{border-color:var(--btc);}
.mv-day.selected{background:var(--btc-dim);border-color:var(--btc);box-shadow:0 0 0 1px var(--btc);}
.mv-daynum{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:0.74rem;font-weight:700;color:var(--text-muted);line-height:1.2;}
.mv-day.today .mv-daynum>span:first-child{background:var(--btc);color:#0A0A0A;border-radius:4px;padding:0 5px;font-weight:800;}
.clash-flag{font-size:0.57rem;color:var(--red);font-weight:800;letter-spacing:.04em;}
.mv-pills{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;}
/* Square ends by default so a multi-day run reads as one continuous band;
   radius is re-added at the true start/end of the run and at week boundaries. */
.mv-pill{flex-shrink:0;padding:2px 6px;border-radius:0;font-size:0.65rem;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--cd);color:var(--c);}
.mv-pill.r-l{border-top-left-radius:4px;border-bottom-left-radius:4px;}
.mv-pill.r-r{border-top-right-radius:4px;border-bottom-right-radius:4px;}
.mv-pill.cont{opacity:.72;}
.mv-more{flex-shrink:0;font-size:0.59rem;font-weight:800;color:var(--text-faint);letter-spacing:0.04em;}
/* Event panel — same screen, own scroll */
.mv-side{min-width:0;min-height:0;display:flex;flex-direction:column;}
.mv-side-head{flex-shrink:0;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.mv-side-title{font-family:var(--font-display);font-size:1.28rem;line-height:1.2;min-width:0;}
.mv-side-title span{display:block;font-family:var(--font-body);font-size:0.65rem;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);margin-top:5px;}
.mv-clear{margin-left:auto;flex-shrink:0;font-size:0.67rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--btc);padding:5px 9px;border-radius:var(--radius-sm);border:1px solid rgba(247,147,26,.35);transition:background .14s;}
.mv-clear:hover{background:var(--btc-dim);}
.mv-side-scroll{flex:1;min-height:0;overflow-y:auto;padding-right:5px;}
.mv-side-scroll::-webkit-scrollbar{width:6px;}
.mv-side-scroll::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}
.mv-events{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;}
/* Priority band header — makes the non-chronological order read as deliberate */
.ev-group{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:0.62rem;font-weight:800;letter-spacing:0.11em;text-transform:uppercase;color:var(--c);}
.ev-group:first-child{margin-top:0;}
.ev-group em{font-style:normal;font-size:0.6rem;font-weight:800;letter-spacing:0;padding:1px 6px;border-radius:99px;background:var(--cd);}
.ev-group i{flex:1;height:1px;background:var(--c);opacity:.22;}
/* EVENT CARD (shared by the month panel) */
.ev{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 15px;border-left:3px solid var(--c);}
.ev.gone{opacity:.55;}
.ev-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.ev-date{font-size:0.67rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
.ev-title{font-weight:700;font-size:0.95rem;line-height:1.35;margin-bottom:6px;}
.ev-notes{font-size:0.81rem;color:var(--text-muted);line-height:1.55;}
.z-empty{color:var(--text-faint);font-size:0.88rem;text-align:center;padding:34px 12px;line-height:1.6;}
.type-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:0.62rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;background:var(--cd);color:var(--c);}
.span-tag{display:inline-block;font-size:0.6rem;font-weight:700;color:var(--text-faint);letter-spacing:0.05em;text-transform:uppercase;}
/* CLASH PANEL */
.clash-panel{background:rgba(241,86,95,.07);border:1px solid rgba(241,86,95,.3);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;}
.clash-panel h4{font-size:0.64rem;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:var(--red);margin-bottom:7px;}
.clash-panel ul{list-style:none;display:flex;flex-direction:column;gap:6px;}
.clash-panel li{font-size:0.76rem;color:var(--text-muted);line-height:1.45;}
.clash-panel b{color:var(--text);font-weight:600;}
/* STATUS TOGGLE (Possible <-> Attending) */
.status-toggle{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-size:0.71rem;font-weight:700;padding:7px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-hi);background:transparent;letter-spacing:0.02em;transition:background .15s,border-color .15s,color .15s;}
.status-toggle.possible{color:var(--green);border-color:rgba(62,207,142,.45);}
.status-toggle.possible:hover{background:var(--green);color:#0A0A0A;border-color:var(--green);}
.status-toggle.attending{color:var(--text-muted);}
.status-toggle.attending:hover{background:var(--surface-3);color:var(--text);}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:500;opacity:0;pointer-events:none;transition:opacity .18s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border-hi);border-radius:var(--radius-lg);width:100%;max-width:460px;padding:26px;transform:translateY(10px);transition:transform .18s;max-height:92dvh;overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-date{font-family:var(--font-display);font-size:1.3rem;}
.modal-x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-muted);transition:background .15s,color .15s;}
.modal-x:hover{background:var(--surface-3);color:var(--text);}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:0.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:7px;}
.fg input,.fg select,.fg textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font:inherit;font-size:0.93rem;color:var(--text);transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--btc);}
.fg textarea{resize:vertical;min-height:80px;line-height:1.5;}
.fg select option{background:var(--surface);}
.fg-hint{font-size:0.68rem;color:var(--text-faint);margin-top:5px;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn-ghost{padding:10px 16px;border-radius:var(--radius-sm);color:var(--text-muted);transition:background .15s,color .15s;}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.saved-flash{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface-3);border:1px solid var(--border-hi);color:var(--text);font-size:0.8rem;font-weight:600;padding:9px 16px;border-radius:99px;z-index:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.saved-flash.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Below ~1150px a 400px event panel starves the day grid (columns drop under ~90px and
   event titles truncate to nothing), so stack instead and hand the page its scroll back. */
@media(max-width:1150px){
  .mv-layout{grid-template-columns:minmax(0,1fr);height:auto;}
  .mv-days{grid-auto-rows:minmax(96px,auto);overflow:visible;}
  .mv-side{margin-top:22px;}
  .mv-side-scroll{overflow:visible;padding-right:0;}
  .month-view{height:auto;}
  .scroll.locked{overflow-y:auto;padding:18px 28px 60px;}
}
/* Three view buttons + Today + Add overflow a narrow header, so let it wrap. */
@media(max-width:900px){
  .header{flex-wrap:wrap;gap:10px 12px;}
  .view-tools{margin-left:auto;}
}
@media(max-width:600px){
  .header{padding:9px 12px;gap:8px;}
  .logo-text{font-size:1.05rem;}
  .logo-text span{font-size:0.56rem;}
  .year-nav{gap:8px;}
  .year-nav span{font-size:1.3rem;min-width:58px;}
  .year-nav button{width:30px;height:30px;}
  .view-tools{gap:6px;}
  .seg button{padding:6px 8px;font-size:0.7rem;gap:5px;}
  .btn-today{padding:7px 9px;font-size:0.7rem;}
  .btn-add{padding:8px 11px;}
  .btn-add span{display:none;}          /* icon-only Add on phones */
  .toolbar{padding:8px 14px;gap:9px;}
  .search-wrap{max-width:none;}
  .tool-right{margin-left:0;}
  .monthbar{padding:7px 10px;gap:6px;}
  .mb-m{min-width:48px;font-size:0.66rem;}
  .scroll{padding:16px 14px 50px;}
  .scroll.locked{padding:16px 14px 50px;}
  .year-grid{grid-template-columns:1fr;}
  .mv-cal{padding:11px;}
  .mv-cal-title{font-size:1.35rem;}
  .mv-days{grid-auto-rows:minmax(66px,auto);gap:3px;}
  .mv-day{padding:4px;}
  .mv-pill{font-size:0.57rem;padding:1px 4px;}
  .search-results-grid{grid-template-columns:1fr;}
  .fg-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="tooltip" id="tooltip"></div>
<div class="saved-flash" id="savedFlash">Saved</div>

<!-- SEARCH RESULTS OVERLAY -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-overlay-head">
    <button class="search-close-btn" id="searchCloseBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Calendar
    </button>
    <div class="search-overlay-label" id="searchLabel">Results</div>
  </div>
  <div class="search-results-body">
    <div class="search-results-grid" id="searchGrid"></div>
  </div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
      <path d="M16 18h26c5.5 0 9.5 3 9.5 7.8 0 3.8-2.4 6.3-6 7.3 4.6.9 7.5 3.9 7.5 8.2 0 5.6-4.7 9.7-11.8 9.7H16" stroke="#F7931A" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="24" y1="11" x2="24" y2="53" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>
      <line x1="34" y1="11" x2="34" y2="53" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="logo-text">Strive <span>Internal Planning Calendar</span></div>
  </div>
  <div class="year-nav">
    <button id="prevYear" title="Previous year"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="yearLabel">2026</span>
    <button id="nextYear" title="Next year"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="view-tools">
    <div class="seg">
      <button id="viewMonth" class="on" title="One month, with that month&rsquo;s events beside it (M)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        Month
      </button>
      <button id="viewAgenda" title="Chronological list of every event (A)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Agenda
      </button>
      <button id="viewYear" title="All 12 months at once (Y)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Year
      </button>
    </div>
    <button class="btn-today" id="todayBtn" title="Jump to today">Today</button>
    <button class="btn-add" id="addBtn" title="Add an event (saved in your browser only)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add Event</span>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="legend" id="legend"></div>
  <div class="search-wrap">
    <span class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <input class="search-input" id="searchInput" type="text" placeholder="Search events, notes, attendees…" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="tool-right">
    <span class="search-hint" id="searchHint"></span>
    <span class="legend-count" id="legendCount"></span>
    <button class="btn-mini warn" id="resetLocal" style="display:none" title="Discard the changes saved in this browser and return to the published calendar"></button>
    <button class="btn-mini" id="exportIcs" title="Download everything currently shown as an .ics file you can import into Outlook, Google Calendar or Apple Calendar">&#8595; Export .ics</button>
  </div>
</div>

<!-- MONTH NAVIGATION (month view only) -->
<div class="monthbar" id="monthBar">
  <button class="mb-arrow" id="mbPrev" title="Previous month (←)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="mb-months" id="mbMonths"></div>
  <button class="mb-arrow" id="mbNext" title="Next month (→)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
</div>

<div class="scroll locked" id="scroll">
  <!-- MONTH VIEW — grid on the left, that month's events on the right, same screen -->
  <div class="month-view" id="monthView">
    <div class="mv-layout">
      <section class="mv-cal">
        <div class="mv-cal-head">
          <h2 class="mv-cal-title" id="mvTitle"></h2>
          <div class="mv-glance" id="mvGlance"></div>
        </div>

<!-- ADD MODAL -->
<div class="overlay" id="addModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-date">Add Event</div>
      <button class="modal-x" id="addModalClose"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fg"><label>Title</label><input type="text" id="fTitle" placeholder="Event name"></div>
    <div class="fg-row">
      <div class="fg"><label>Start date</label><input type="date" id="fDate"></div>
      <div class="fg"><label>End date <span style="text-transform:none;font-weight:500">(optional)</span></label><input type="date" id="fEnd"></div>
    </div>

      <select id="fType">
        <option value="possible">Conference — Possible</option>
        <option value="attending">Conference — Attending</option>

        <option value="milestone">Strive Milestone</option>
        <option value="holiday">Holiday / OOO</option>
      </select>

</div>

<script>
'use strict';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WD_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TYPE_LABELS={bitcoin:'Bitcoin Date',milestone:'Strive Milestone',attending:'Attending',possible:'Possible',holiday:'Holiday / OOO'};
/* ── THE PRIORITY ORDER ──
   ONE list drives every ordered surface, so the toolbar chips and the event panel can
   never drift apart: legend/filter chips, the month "at a glance" chips, the side-panel
   bands, the pills inside a day cell, and the tiebreak between same-date events.
   Changing this line changes all of them. */
const TYPE_ORDER=['attending','bitcoin','possible','milestone','holiday'];
const TYPE_VAR={bitcoin:'--btc',milestone:'--yellow',attending:'--green',possible:'--red',holiday:'--blue'};
const GROUP_LABELS={attending:'Attending',bitcoin:'Bitcoin dates',possible:'Under consideration',milestone:'Strive milestones',holiday:'Holidays &amp; closures'};
const prio=t=>TYPE_ORDER.indexOf(t);
const byPriority=(a,b)=>prio(a.type)-prio(b.type)||a.date.localeCompare(b.date);
const LS_KEY='strive-calendar-v1';
const today=new Date();

let year=today.getFullYear();
let month=today.getMonth();
let view='month';
let nextId=300;
let selectedDay=null;
let activeTypes=new Set(TYPE_ORDER);

const typeLabel=t=>TYPE_LABELS[t]||t;
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── DATE HELPERS (range-aware) ── */
const dnum=ds=>{const[y,m,d]=ds.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5;};
const endOf=e=>e.end||e.date;
const spans=e=>dnum(endOf(e))-dnum(e.date)+1;
const covers=(e,ds)=>{const x=dnum(ds);return x>=dnum(e.date)&&x<=dnum(endOf(e));};
const dayIndex=(e,ds)=>dnum(ds)-dnum(e.date)+1;
const fmt=ds=>{const[y,m,d]=ds.split('-');return `${MONTHS[+m-1]} ${+d}, ${y}`;};
function fmtSpan(e){
  if(!e.end||e.end===e.date)return fmt(e.date);
  const[y1,m1,d1]=e.date.split('-'),[y2,m2,d2]=e.end.split('-');
  if(y1===y2&&m1===m2)return `${MONTHS[+m1-1]} ${+d1}–${+d2}, ${y1}`;
  if(y1===y2)return `${MON_SHORT[+m1-1]} ${+d1} – ${MON_SHORT[+m2-1]} ${+d2}, ${y1}`;
  return `${fmt(e.date)} – ${fmt(e.end)}`;
}

/* ── DATA ──
   Multi-day events use a single entry with `end`.
   NOTE: `rec` (suggested attendees) is retained on many events but is no longer
   rendered anywhere — the owner asked for it to come out of the UI. It is left in
   the source so the research isn't lost; delete the fields if you want it gone. */
let events=[
  // ── STRIVE EVENTS & CONFERENCES ──
  {id:1,date:'2026-06-26',title:'BFC Symposium — New York',type:'possible',rec:'Jeff Walton (CRO) and Ben Werkman (CIO) are already slated to speak — keep both; this is a Bitcoin-for-companies audience where the risk framework and the investment thesis both land.',notes:'Jeff Walton and Ben Werkman speaking. Bitcoin for Companies symposium in New York City. Prepare talking points, slides, and networking materials. Confirm travel logistics and attendee list in advance.'},
  {id:3,date:'2026-10-15',end:'2026-10-17',title:'Bitcoin Alpha — Santa Monica',type:'possible',rec:'Ben Werkman (CIO) to lead on the Bitcoin investment thesis and SATA; reserve the CEO for flagship stages given how packed October is.',notes:'Bitcoin Alpha conference, Santa Monica CA. Oct 15–17 (3 days). Prepare digital assets collateral and physical handouts. Confirm speaker schedule and booth setup. Day 3: wrap-up, follow-up scheduling, post-event debrief.'},
  {id:6,date:'2026-07-22',end:'2026-07-23',title:'Miami Event — Golf w/ Celebrities & Advisors',type:'possible',rec:'Matt Cole (CEO) — a high-touch relationship and brand event with celebrities and advisors is ideal for the CEO; Ben Werkman (CIO) to turn advisor conversations into SATA interest.',notes:'Miami. Golfing event with celebrities and advisors, July 22–23. Confirm guest list, logistics, and talking points for advisor conversations. Day 2 is follow-up conversations, networking, and informal meetings. Strong opportunity for relationship building and brand positioning.'},
  {id:8,date:'2026-08-27',end:'2026-08-29',title:'BTC Hong Kong',type:'attending',rec:'Ben Werkman (CIO) to lead on APAC institutional capital and the SATA story; Jeff Walton (CRO) is a strong add for the Hong Kong regulatory and compliance lens.',notes:'BTC Hong Kong conference, Aug 27–29. BRING: Digital Assets collateral (decks, one-pagers), physical handouts, business cards, SATA and ASST materials. Prep Asia-Pacific messaging and compliance review for the HK market. Final day: media availability, wrap-up networking, post-event debrief and follow-up list. NOTE: the public Bitcoin Asia 2026 programme is listed as Aug 27–28 — confirm whether our third day is conference programming or team meetings.'},
  {id:11,date:'2026-09-22',title:'TrueNorth Event / Happy Hour @ BTC Treasuries Conference — New York',type:'attending',rec:'Matt Cole (CEO) to host — this is a Strive-branded room of treasury decision-makers; Ben Werkman (CIO) for the SATA and treasury-strategy conversations.',notes:'TrueNorth Event and Happy Hour co-located with the Bitcoin Treasuries Conference in New York. September date still TBD. IMPORTANT: the Bitcoin Treasuries Conference itself is confirmed for Sep 28 at SECOND in Midtown — consider moving this happy hour to Sep 28 so the two line up. Confirm RSVP list, venue logistics, and Strive brand presence.'},
  {id:12,date:'2027-04-07',title:'RiskWorld 2027',type:'possible',rec:'Jeff Walton (CRO) — a dedicated risk-management conference is the natural home for the Chief Risk Officer and positions Strive\'s risk framework to an institutional audience.',notes:'RiskWorld annual conference 2027. Begin planning Strive presence, booth logistics, and speaking submissions early (typically 6+ months in advance). Key risk management and institutional audience — strategic networking opportunity for ASST and SATA positioning.'},
  // ── STRIVE MILESTONES ──
  {id:13,date:'2026-06-16',title:'SATA Daily Dividend Launch — U.S. First',type:'milestone',notes:'Strive\'s SATA preferred stock begins paying dividends every business day — the first U.S.-listed security in history to do so. 13% annualized rate (approximately 13.88% effective with daily compounding). Previously paid monthly. Historic milestone for Strive and the Bitcoin-backed income investing category. Traded on Nasdaq near $100 par value.'},
  {id:14,date:'2025-12-01',title:'Strive Becomes Publicly Traded — Reverse Merger Complete (ASST)',type:'milestone',notes:'Strive completed its reverse merger with Asset Entities and began trading on Nasdaq under ticker ASST as a fully public Bitcoin Treasury Corporation. Marks the formal launch of Strive as a public company pursuing the Bitcoin standard treasury strategy alongside Strategy (MSTR). Matt Cole, CEO.'},
  {id:15,date:'2026-03-09',title:'B. Riley Initiates Coverage — Buy Rating, $12 Price Target',type:'milestone',notes:'Investment bank B. Riley initiated coverage on Strive Inc. (ASST) with a Buy rating and $12 price target. Simultaneously initiated on Strategy (MSTR). First major Wall Street coverage validates Strive\'s institutional credibility and Bitcoin treasury thesis.'},
  // ── BITCOIN HISTORICAL ──
  {id:50,date:'2026-01-03',title:'Bitcoin Genesis Block Anniversary (Jan 3, 2009)',type:'bitcoin',notes:'January 3, 2009: Satoshi Nakamoto mined the first Bitcoin block — Block 0. Embedded in the coinbase transaction: "The Times 03/Jan/2009 Chancellor on brink of second bailout for banks." This single act launched the Bitcoin network and the era of sound, decentralized, sovereign money. The 50 BTC in the genesis block can never be spent. Every January 3rd, Bitcoiners worldwide celebrate Bitcoin\'s birthday.'},
  {id:51,date:'2026-01-09',title:'Bitcoin Network Live Anniversary (Jan 9, 2009)',type:'bitcoin',notes:'January 9, 2009: Satoshi Nakamoto released Bitcoin v0.1 software publicly on SourceForge and mined Block 1. The same day, Hal Finney received the very first Bitcoin transaction — 10 BTC sent by Satoshi. The peer-to-peer electronic cash system described in the October 2008 whitepaper was now live on the internet.'},
  {id:52,date:'2026-10-31',title:'Bitcoin Whitepaper Day (Oct 31, 2008)',type:'bitcoin',notes:'October 31, 2008: Satoshi Nakamoto published "Bitcoin: A Peer-to-Peer Electronic Cash System" to a cryptography mailing list. The 9-page whitepaper introduced blockchain technology, proof-of-work consensus, and the concept of trustless digital money without banks. Published on Halloween — widely considered the scariest document ever written for central banks and legacy financial institutions.'},
  {id:53,date:'2026-05-22',title:'Bitcoin Pizza Day (May 22, 2010)',type:'bitcoin',notes:'May 22, 2010: Laszlo Hanyecz completed the first known real-world Bitcoin transaction — paying 10,000 BTC for two Papa John\'s pizzas ordered by Jeremy Sturdivant. At Bitcoin\'s 2021 peak near $69K/BTC, those pizzas were worth approximately $690 million. Celebrated annually as Bitcoin Pizza Day, marking the moment BTC became a medium of exchange, not just a cryptographic experiment.'},
  {id:54,date:'2026-11-28',title:'Bitcoin First Halving Anniversary (Nov 28, 2012)',type:'bitcoin',notes:'November 28, 2012: Bitcoin\'s first programmed halving at block 210,000 cut the mining reward from 50 BTC to 25 BTC. This was the first live proof that Bitcoin\'s disinflationary monetary policy functioned exactly as Satoshi designed. Price at the time: ~$12. Twelve months later, Bitcoin traded above $1,000. The halving mechanism is central to Bitcoin\'s scarcity proposition.'},
  {id:55,date:'2026-07-09',title:'Bitcoin Second Halving Anniversary (Jul 9, 2016)',type:'bitcoin',notes:'July 9, 2016: Bitcoin\'s second halving at block 420,000 cut the reward from 25 BTC to 12.5 BTC. The subsequent 2017 bull cycle saw Bitcoin reach ~$20,000 in December 2017. Institutional and mainstream awareness began growing meaningfully following this halving. The pattern of post-halving appreciation became widely recognized.'},
  {id:56,date:'2026-05-11',title:'Bitcoin Third Halving Anniversary (May 11, 2020)',type:'bitcoin',notes:'May 11, 2020: Bitcoin\'s third halving at block 630,000 cut the reward from 12.5 BTC to 6.25 BTC. MicroStrategy (now Strategy) began its Bitcoin treasury strategy in August 2020 just months after this halving, pioneering the corporate Bitcoin treasury playbook that Strive now embodies. Bitcoin reached ~$69,000 in November 2021.'},
  {id:57,date:'2026-04-20',title:'Bitcoin Fourth Halving Anniversary (Apr 20, 2024)',type:'bitcoin',notes:'April 20, 2024: Bitcoin\'s fourth halving at block 840,000 cut the reward from 6.25 BTC to 3.125 BTC — the first halving in the spot ETF era. BlackRock, Fidelity, and other asset managers had just launched spot Bitcoin ETFs in January 2024. Demand shock met supply shock. Next halving projected for March–April 2028 (reward: 1.5625 BTC).'},
  {id:58,date:'2026-01-11',title:'Spot Bitcoin ETF Approval Anniversary (Jan 11, 2024)',type:'bitcoin',notes:'January 11, 2024: The SEC approved 11 spot Bitcoin ETFs in the United States including BlackRock IBIT, Fidelity FBTC, ARK 21Shares, and others. Over $10 billion in inflows in the first week. The most consequential regulatory event in Bitcoin\'s history — opening the door to institutional capital at unprecedented scale. Strive operates in the world made possible by this approval.'},
  {id:59,date:'2026-12-05',title:'Bitcoin $100K Milestone Anniversary (Dec 2024)',type:'bitcoin',notes:'December 5, 2024: Bitcoin crossed $100,000 per coin for the first time in history — a milestone long predicted by Bitcoin advocates. Occurred in the post-ETF, post-halving macro environment following Donald Trump\'s election victory in November 2024. Validated the thesis: institutional adoption + supply reduction + favorable regulatory environment = sustained price appreciation.'},
  {id:60,date:'2026-02-14',title:'Lightning Network Mainnet Anniversary (Feb 2018)',type:'bitcoin',notes:'February 2018: The Bitcoin Lightning Network launched its mainnet beta, enabling near-instant, essentially zero-fee Bitcoin transactions via off-chain payment channels. Lightning is Bitcoin\'s Layer 2 scaling solution — allowing millions of transactions per second without touching the base layer. Central to Bitcoin\'s viability as an everyday medium of exchange globally.'},
  {id:61,date:'2026-11-14',title:'Bitcoin Taproot Upgrade Anniversary (Nov 14, 2021)',type:'bitcoin',notes:'November 14, 2021: Bitcoin\'s Taproot upgrade activated at block 709,632 — the most significant protocol upgrade since SegWit in 2017. Taproot improved transaction privacy, reduced script complexity, improved smart contract capabilities, and laid groundwork for future Bitcoin development. Passed with near-unanimous miner signaling via Speedy Trial, demonstrating Bitcoin\'s careful, consensus-driven governance model.'},
  {id:62,date:'2026-08-01',title:'Bitcoin Cash Fork Anniversary (Aug 1, 2017)',type:'bitcoin',notes:'August 1, 2017: Bitcoin Cash (BCH) hard-forked from Bitcoin in a contentious split over the block size debate. Bitcoiners kept the original 1MB block chain with SegWit. This event crystallized Bitcoin\'s decentralized governance and the importance of the small-block, Layer 2 scaling philosophy. BCH has since declined dramatically in relevance, while Bitcoin\'s approach was validated. "Not your keys, not your coins."'},

/* ── PERSISTENCE ── */
const BASE_TYPE={};
events.forEach(e=>{BASE_TYPE[e.id]=e.type;});
const flashEl=document.getElementById('savedFlash');
let flashTimer=null;
function flash(msg){
  flashEl.textContent=msg;
  flashEl.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>flashEl.classList.remove('show'),1400);
}
function saveState(){
  try{
    const overrides={};
    events.forEach(e=>{if(BASE_TYPE[e.id]!==undefined&&e.type!==BASE_TYPE[e.id])overrides[e.id]=e.type;});
    const custom=events.filter(e=>e.custom).map(e=>({id:e.id,date:e.date,end:e.end,title:e.title,type:e.type,notes:e.notes,custom:true}));
    localStorage.setItem(LS_KEY,JSON.stringify({v:1,overrides,custom}));
  }catch(err){/* storage unavailable (private mode / file restrictions) — session-only */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(s&&s.overrides)Object.keys(s.overrides).forEach(id=>{
      const t=s.overrides[id],e=events.find(x=>x.id===+id);
      if(e&&TYPE_LABELS[t])e.type=t;
    });
    if(s&&Array.isArray(s.custom))s.custom.forEach(c=>{
      if(c&&c.id!=null&&c.date&&c.title&&TYPE_LABELS[c.type]&&!events.some(e=>e.id===c.id)){
        events.push(c);
        BASE_TYPE[c.id]=c.type;
      }
    });
    const ids=events.filter(e=>e.custom).map(e=>e.id);
    if(ids.length)nextId=Math.max(nextId,Math.max.apply(null,ids)+1);
  }catch(err){/* corrupt or unavailable storage — fall back to defaults */}
}
loadState();

/* ── QUERIES (filter-aware) ── */
const shown=()=>events.filter(e=>activeTypes.has(e.type));
const byDate=ds=>shown().filter(e=>covers(e,ds)).sort(byPriority);
function byMonth(y,m){
  const first=`${y}-${pad(m+1)}-01`,last=`${y}-${pad(m+1)}-${pad(new Date(y,m+1,0).getDate())}`;
  const lo=dnum(first),hi=dnum(last);
  return shown().filter(e=>dnum(e.date)<=hi&&dnum(endOf(e))>=lo).sort((a,b)=>a.date.localeCompare(b.date)||TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));
}
const inYear=y=>shown().filter(e=>+e.date.slice(0,4)===y||+endOf(e).slice(0,4)===y);
/* travel commitments that can physically conflict */
const isTravel=e=>e.type==='attending'||e.type==='possible';

/* ── LOCAL (per-browser) CHANGES ──
   Everything saved here lives in this browser only. It never reaches the shared
   calendar, so the UI has to say so plainly wherever a change can be made. */
function localChangeCount(){
  let n=0;
  events.forEach(e=>{
    if(e.custom)n++;
    else if(BASE_TYPE[e.id]!==undefined&&e.type!==BASE_TYPE[e.id])n++;
  });
  return n;
}
function resetLocal(){
  const n=localChangeCount();
  if(!n)return;
  if(!confirm(`Reset ${n} local change${n>1?'s':''}?\n\nThis clears the Attending/Possible flips and any events you added in this browser, and returns the calendar to the published version. Nobody else is affected — their browsers were never changed.`))return;
  try{localStorage.removeItem(LS_KEY);}catch(err){/* storage unavailable */}
  location.reload();
}

/* ── .ICS EXPORT ── */
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
/* RFC 5545: all-day DTEND is exclusive, so a 3-day event ends on day 4. */
function icsEnd(ds){
  const d=new Date((dnum(ds)+1)*864e5);
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`;
}
/* RFC 5545 folds at 75 OCTETS, not characters — and a fold must never land inside a
   character. for..of walks code points, so surrogate pairs stay intact. */
const TE=new TextEncoder();
function icsFold(line){
  const out=[];let cur='',n=0;
  for(const ch of line){
    const w=TE.encode(ch).length;
    if(n+w>75){out.push(cur);cur=' '+ch;n=1+w;}
    else{cur+=ch;n+=w;}
  }
  out.push(cur);
  return out.join('\r\n');
}
function exportICS(){
  const list=shown().slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){flash('Nothing to export — every filter is off');return;}
  const stamp=`${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}T000000Z`;
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Strive//Internal Planning Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Strive Planning Calendar'];
  list.forEach(e=>{
    out.push('BEGIN:VEVENT',
      `UID:strive-${e.id}@strive-planning-calendar`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${icsEnd(endOf(e))}`,
      icsFold(`SUMMARY:${icsEsc(e.title)}`),
      icsFold(`DESCRIPTION:${icsEsc(e.notes||'')}`),
      icsFold(`CATEGORIES:${icsEsc(typeLabel(e.type))}`),
      'TRANSP:TRANSPARENT','END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const url=URL.createObjectURL(new Blob([out.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;a.download='strive-planning-calendar.ics';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  flash(`Downloaded ${list.length} events as .ics`);
}

/* ── LEGEND / FILTERS ── */
function renderLegend(){
  const host=document.getElementById('legend');
  const counts={};
  TYPE_ORDER.forEach(t=>{counts[t]=events.filter(e=>e.type===t&&(+e.date.slice(0,4)===year||+endOf(e).slice(0,4)===year)).length;});
  host.innerHTML=TYPE_ORDER.map(t=>`<button class="legend-item${activeTypes.has(t)?'':' off'}" data-t="${t}" title="Show / hide ${esc(typeLabel(t))}"><span class="legend-dot" style="background:var(${TYPE_VAR[t]})"></span>${esc(typeLabel(t))}<span class="legend-n">${counts[t]}</span></button>`).join('');
  const n=localChangeCount(),reset=document.getElementById('resetLocal');
  reset.style.display=n?'':'none';
  if(n)reset.innerHTML=`&#8634; Reset my ${n} change${n>1?'s':''}`;
  document.getElementById('legendCount').textContent=`${inYear(year).length} shown in ${year}`;
}
document.getElementById('exportIcs').onclick=exportICS;
document.getElementById('resetLocal').onclick=resetLocal;
document.getElementById('legend').addEventListener('click',e=>{
  const b=e.target.closest('.legend-item');
  if(!b)return;
  const t=b.dataset.t;
  if(activeTypes.has(t)){
    if(activeTypes.size===1)return; // never hide everything
    activeTypes.delete(t);
  }else activeTypes.add(t);
  renderLegend();render();
});

/* ── SHARED EVENT BITS ── */
const TODAY_DS=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const TODAY_N=dnum(TODAY_DS);
const isPast=e=>dnum(endOf(e))<TODAY_N;
/* "How soon is this?" — the question the team actually asks of a planning calendar. */
function relOf(e){
  const s=dnum(e.date),en=dnum(endOf(e));
  if(TODAY_N>en)return{t:'Done',c:'gone'};
  if(TODAY_N>=s)return{t:spans(e)>1?`Now · day ${TODAY_N-s+1} of ${spans(e)}`:'Today',c:'now'};
  const d=s-TODAY_N;
  if(d===1)return{t:'Tomorrow',c:'soon'};
  if(d<=14)return{t:`In ${d} days`,c:'soon'};
  if(d<=70)return{t:`In ${Math.round(d/7)} weeks`,c:''};
  return{t:`In ${Math.round(d/30.44)} months`,c:''};
}
const relTag=e=>{const r=relOf(e);return `<span class="rel ${r.c}">${r.t}</span>`;};
/* The status toggle writes to localStorage only. Say so every single time it is offered,
   and be specific about what teammates opening the same link actually see. */
function toggleBtn(e){
  if(!isTravel(e))return '';
  const base=BASE_TYPE[e.id];
  const note=e.custom
    ? `You added this in your browser &mdash; it is not on the shared calendar at all.`
    : (base!==undefined&&e.type!==base
        ? `Changed by you. Teammates opening the link still see this as <b>${esc(typeLabel(base))}</b>.`
        : `Saves in your browser only &mdash; it will not change what teammates see.`);
  return `<button class="status-toggle ${e.type}" data-id="${e.id}" title="Changes how this event looks for you. Saved in this browser only — it does not update the shared calendar.">`
    +(e.type==='possible'?'&#10003; Mark attending &mdash; for me':'&#8634; Move back to possible')
    +`</button><span class="local-note">${note}</span>`;
}

/* ── AGENDA VIEW ── */
let expanded=new Set();
/* events that overlap another travel event anywhere in the year */
function clashSet(list){
  const trav=list.filter(isTravel),out=new Set();
  for(let i=0;i<trav.length;i++)for(let j=i+1;j<trav.length;j++){
    const a=trav[i],b=trav[j];
    if(dnum(a.date)<=dnum(endOf(b))&&dnum(b.date)<=dnum(endOf(a))){out.add(a.id);out.add(b.id);}
  }
  return out;
}
function renderAgenda(){
  const host=document.getElementById('agenda');
  const list=inYear(year).slice().sort((a,b)=>a.date.localeCompare(b.date)||TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));
  if(!list.length){
    host.innerHTML=`<div class="ag-empty"><h3>Nothing to show in ${year}</h3><p>Try another year, or switch a filter back on above.</p></div>`;
    return;
  }
  const clashes=clashSet(list);
  let html='',curMonth=-1,todayDrawn=false;
  const groups={};
  list.forEach(e=>{const m=+e.date.slice(5,7)-1;(groups[m]=groups[m]||[]).push(e);});
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(m=>{
    const evts=groups[m];
    html+=`<div class="ag-group"><div class="ag-month"><h3>${MONTHS[m]}</h3><button class="ag-jump" data-m="${m}">Open month &rarr;</button><span class="ag-n">${evts.length} event${evts.length>1?'s':''}</span></div>`;
    evts.forEach(e=>{
      const past=isPast(e);
      if(!todayDrawn&&!past&&year===today.getFullYear()){
        html+=`<div class="ag-today-line"><span>Today &middot; ${MON_SHORT[today.getMonth()]} ${today.getDate()}</span><i></i></div>`;
        todayDrawn=true;
      }
      const dt=new Date(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8,10));
      const multi=spans(e)>1;
      const long=e.notes&&e.notes.length>150;
      const open=expanded.has(e.id);
      html+=`<div class="ag-row ${e.type}${past?' past':''}">`
        +`<div class="ag-when"><span class="ag-dow">${WD[dt.getDay()]}</span><span class="ag-dnum">${+e.date.slice(8,10)}</span>`
        +(multi?`<span class="ag-range">${esc(fmtSpan(e).replace(/, \d{4}$/,''))} · ${spans(e)}d</span>`:'')
        +`</div>`
        +`<div class="ag-main">`
        +`<div class="ag-head"><span class="type-tag ${e.type}">${esc(typeLabel(e.type))}</span>`
        +relTag(e)
        +(clashes.has(e.id)?`<span class="ag-clash">⚠ overlaps another trip</span>`:'')
        +`</div>`
        +`<div class="ag-title">${esc(e.title)}</div>`
        +(e.notes?`<div class="ag-notes${long&&!open?' clamp':''}">${esc(e.notes)}</div>`:'')
        +(long?`<button class="ag-more" data-x="${e.id}">${open?'Show less':'Show more'}</button>`:'')
        +toggleBtn(e)
        +`</div></div>`;
    });
    html+=`</div>`;
  });
  host.innerHTML=html;
}
/* agenda interactions: expand notes + jump into a month */
document.getElementById('agenda').addEventListener('click',ev=>{
  const more=ev.target.closest('.ag-more');
  if(more){
    const id=+more.dataset.x;
    if(expanded.has(id))expanded.delete(id);else expanded.add(id);
    renderAgenda();
    return;
  }
  const jump=ev.target.closest('.ag-jump');
  if(jump){month=+jump.dataset.m;selectedDay=null;setView('month');}
});

/* ── VIEW SWITCHING ── */
const VIEW_EL={month:'viewMonth',agenda:'viewAgenda',year:'viewYear'};
function setView(v){
  view=v;
  document.getElementById('monthView').style.display=v==='month'?'':'none';
  document.getElementById('agenda').style.display=v==='agenda'?'':'none';
  document.getElementById('yearGrid').style.display=v==='year'?'':'none';
  document.getElementById('monthBar').classList.toggle('on',v==='month');
  document.getElementById('scroll').classList.toggle('locked',v==='month');
  Object.keys(VIEW_EL).forEach(k=>document.getElementById(VIEW_EL[k]).classList.toggle('on',k===v));
  render();
  document.getElementById('scroll').scrollTo(0,0);
  if(v==='year'&&year===today.getFullYear())setTimeout(()=>scrollToMonth(today.getMonth()),100);
  if(v==='agenda')setTimeout(scrollToToday,100);
}
function scrollToToday(){
  const line=document.querySelector('.ag-today-line');
  if(line)line.scrollIntoView({behavior:'smooth',block:'center'});
}
Object.keys(VIEW_EL).forEach(k=>{document.getElementById(VIEW_EL[k]).onclick=()=>setView(k);});
document.getElementById('todayBtn').onclick=()=>{
  closeSearch();
  const changed=year!==today.getFullYear();
  year=today.getFullYear();month=today.getMonth();selectedDay=null;
  if(changed)renderLegend();
  render();
  if(view==='agenda')setTimeout(scrollToToday,80);
  else if(view==='year')setTimeout(()=>scrollToMonth(today.getMonth()),80);
};

/* ── RENDER DISPATCH ── */
function render(){
  document.getElementById('yearLabel').textContent=year;
  renderLegendCountOnly();
  if(view==='agenda'){renderAgenda();return;}
  if(view==='month'){renderMonthView();return;}
  renderYearGrid();
}

/* ── YEAR GRID ── */
function renderYearGrid(){
  const grid=document.getElementById('yearGrid');
  grid.innerHTML='';
  for(let m=0;m<12;m++){
    const card=document.createElement('div');
    card.className='month';
    const tally=byMonth(year,m).length;
    card.innerHTML=`<div class="month-head"><span class="month-name">${MONTHS[m]}</span><span class="month-tally">${tally?tally+' event'+(tally>1?'s':''):''}</span></div><div class="weekdays">${WD.map(d=>`<div>${d}</div>`).join('')}</div><div class="days"></div>`;
    const daysEl=card.querySelector('.days');
    const first=new Date(year,m,1).getDay(),count=new Date(year,m+1,0).getDate();
    for(let i=0;i<first;i++){const c=document.createElement('div');c.className='day empty';daysEl.appendChild(c);}
    for(let d=1;d<=count;d++){
      const ds=`${year}-${pad(m+1)}-${pad(d)}`;
      const evts=byDate(ds);
      const isToday=today.getFullYear()===year&&today.getMonth()===m&&today.getDate()===d;
      const cell=document.createElement('div');
      cell.className='day'+(evts.length?' event':'')+(isToday?' today':'');
      cell.innerHTML=`<span>${d}</span>`+(evts.length?`<div class="day-dots">${evts.slice(0,3).map(e=>`<span class="d ${e.type}"></span>`).join('')}</div>`:'');
      if(evts.length)attachTip(cell,evts,ds);
      daysEl.appendChild(cell);
    }
    card.addEventListener('click',()=>{month=m;selectedDay=null;setView('month');});
    grid.appendChild(card);
  }
}
function renderLegendCountOnly(){
  const el=document.getElementById('legendCount');
  if(el)el.textContent=`${inYear(year).length} shown in ${year}`;
}

/* ── TOOLTIP ── */
const tipEl=document.getElementById('tooltip');
function attachTip(el,evts,ds){
  el.addEventListener('mouseenter',ev=>{
    tipEl.innerHTML=evts.map(e=>{
      const multi=spans(e)>1?`<div class="tooltip-notes" style="color:var(--text-faint)">Day ${dayIndex(e,ds)} of ${spans(e)} · ${esc(fmtSpan(e))}</div>`:'';
      const nt=e.notes?`<div class="tooltip-notes">${esc(e.notes.substring(0,90))}${e.notes.length>90?'…':''}</div>`:'';
      return `<div class="tooltip-row"><span class="tooltip-dot d ${e.type}"></span><div><div class="tooltip-title">${esc(e.title)}</div>${multi}${nt}</div></div>`;
    }).join('');
    tipEl.classList.add('show');
    posTip(el);
    ev.stopPropagation();
  });
  el.addEventListener('mouseleave',()=>tipEl.classList.remove('show'));
}
function posTip(el){
  const r=el.getBoundingClientRect();
  const tw=tipEl.offsetWidth||220,th=tipEl.offsetHeight||60;
  let x=r.left+r.width/2-tw/2,y=r.top-th-10;
  if(y<10)y=r.bottom+10;
  x=Math.max(10,Math.min(x,window.innerWidth-tw-10));
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}

/* ── MONTH VIEW ──
   One month's grid and that month's events side by side on a single screen.
   Clicking a day narrows the panel to that day; clicking it again widens back out. */
const MAX_PILLS=3;
function goMonth(delta){
  let m=month+delta,y=year;
  while(m<0){m+=12;y--;}
  while(m>11){m-=12;y++;}
  month=m;selectedDay=null;
  if(y!==year){year=y;renderLegend();}
  render();
}
function renderMonthView(){
  document.getElementById('mvTitle').textContent=`${MONTHS[month]} ${year}`;
  renderMonthBar();
  renderGlance();
  buildMonthGrid();
  renderMonthPanel();
}
function renderMonthBar(){
  document.getElementById('mbMonths').innerHTML=MONTHS.map((name,m)=>{
    const n=byMonth(year,m).length;
    const now=today.getFullYear()===year&&today.getMonth()===m;
    return `<button class="mb-m${m===month?' on':''}${now?' now':''}" data-m="${m}" title="${name} ${year} — ${n} event${n===1?'':'s'}"><span>${MON_SHORT[m]}</span><em>${n||'·'}</em></button>`;
  }).join('');
}
function renderGlance(){
  const list=byMonth(year,month);
  const host=document.getElementById('mvGlance');
  if(!list.length){host.innerHTML=`<span class="mv-chip none">Nothing scheduled</span>`;return;}
  host.innerHTML=TYPE_ORDER.filter(t=>list.some(e=>e.type===t))
    .map(t=>`<span class="mv-chip ${t}">${list.filter(e=>e.type===t).length} ${esc(typeLabel(t))}</span>`).join('');
}
function buildMonthGrid(){
  document.getElementById('mvWdays').innerHTML=WD.map((d,i)=>`<div${i===0||i===6?' class="we"':''}>${d}</div>`).join('');
  const cont=document.getElementById('mvDays');
  cont.innerHTML='';
  const first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
  for(let i=0;i<first;i++){const c=document.createElement('div');c.className='mv-day empty';cont.appendChild(c);}
  for(let d=1;d<=count;d++){
    const ds=`${year}-${pad(month+1)}-${pad(d)}`;
    const evts=byDate(ds);
    const dow=(first+d-1)%7;
    const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
    const clash=evts.filter(isTravel).length>1;
    const cell=document.createElement('div');
    cell.className='mv-day'+(evts.length?' has-event':'')+(isToday?' today':'')+(selectedDay===d?' selected':'')+(dow===0||dow===6?' we':'');
    cell.dataset.day=d;
    cell.innerHTML=`<div class="mv-daynum"><span>${d}</span>${clash?'<span class="clash-flag" title="Two or more travel commitments overlap on this day">CLASH</span>':''}</div>`
      +`<div class="mv-pills">`+evts.slice(0,MAX_PILLS).map(e=>{
        const i=dayIndex(e,ds),n=spans(e);
        /* round the ends of a run, and also where a week break interrupts it */
        const l=i===1||dow===0,r=i===n||dow===6;
        return `<div class="mv-pill ${e.type}${i>1?' cont':''}${l?' r-l':''}${r?' r-r':''}" title="${esc(e.title)}${n>1?` — ${esc(fmtSpan(e))}`:''}">${i>1?'↳ ':''}${esc(e.title)}</div>`;
      }).join('')+`</div>`
      +(evts.length>MAX_PILLS?`<div class="mv-more">+${evts.length-MAX_PILLS} more</div>`:'');
    cont.appendChild(cell);
  }
}
function eventCard(e,ds){
  const multi=spans(e)>1;
  const dayNote=ds&&multi?` <span class="span-tag">· day ${dayIndex(e,ds)} of ${spans(e)}</span>`:'';
  return `<div class="ev ${e.type}${isPast(e)?' gone':''}">`
    +`<div class="ev-meta"><span class="type-tag ${e.type}">${esc(typeLabel(e.type))}</span>${relTag(e)}</div>`
    +`<div class="ev-date">${esc(fmtSpan(e))}${multi?` <span class="span-tag">· ${spans(e)} days</span>`:''}${dayNote}</div>`
    +`<div class="ev-title">${esc(e.title)}</div>`
    +(e.notes?`<div class="ev-notes">${esc(e.notes)}</div>`:'')
    +toggleBtn(e)
    +`</div>`;
}
function renderMonthPanel(){
  const ds=selectedDay!==null?`${year}-${pad(month+1)}-${pad(selectedDay)}`:null;
  const evts=ds?byDate(ds):byMonth(year,month);
  const dow=ds?new Date(year,month,selectedDay).getDay():0;
  document.getElementById('mvSideTitle').innerHTML=ds
    ? `${WD_FULL[dow]} ${selectedDay}<span>${evts.length} event${evts.length===1?'':'s'} on this day</span>`
    : `This month<span>${evts.length} event${evts.length===1?'':'s'} in ${MONTHS[month]} ${year}</span>`;
  document.getElementById('mvClear').style.display=ds?'':'none';
  renderClashPanel(month,ds);
  const host=document.getElementById('mvEvents');
  if(!evts.length){
    host.innerHTML=`<div class="z-empty">${ds?'Nothing scheduled on this day.':`Nothing scheduled in ${MONTHS[month]} ${year}.`}<br>Turn a filter back on above, or use <b>Add Event</b>.</div>`;
    return;
  }
  /* Priority order, banded by type. Headers only earn their space once there is
     more than one band — a single-type day would just repeat the card's own tag. */
  const ordered=evts.slice().sort(byPriority);
  const bands=[...new Set(ordered.map(e=>e.type))];
  let html='',cur=null;
  ordered.forEach(e=>{
    if(bands.length>1&&e.type!==cur){
      cur=e.type;
      const n=ordered.filter(x=>x.type===e.type).length;
      html+=`<div class="ev-group ${e.type}">${GROUP_LABELS[e.type]}<em>${n}</em><i></i></div>`;
    }
    html+=eventCard(e,ds);
  });
  host.innerHTML=html;
}
document.getElementById('mvDays').addEventListener('click',e=>{
  const cell=e.target.closest('.mv-day.has-event');
  if(!cell)return;
  const d=+cell.dataset.day;
  selectedDay=selectedDay===d?null:d;
  buildMonthGrid();renderMonthPanel();
});
document.getElementById('mvClear').onclick=()=>{selectedDay=null;buildMonthGrid();renderMonthPanel();};
document.getElementById('mbPrev').onclick=()=>goMonth(-1);
document.getElementById('mbNext').onclick=()=>goMonth(1);
document.getElementById('mbMonths').addEventListener('click',e=>{
  const b=e.target.closest('.mb-m');
  if(!b)return;
  month=+b.dataset.m;selectedDay=null;render();
});

/* conflict detection: overlapping travel events in the visible month */
function renderClashPanel(m,dateStr){
  const host=document.getElementById('clashHost');
  host.innerHTML='';
  if(dateStr)return;
  const trav=byMonth(year,m).filter(isTravel);
  const pairs=[];
  for(let i=0;i<trav.length;i++)for(let j=i+1;j<trav.length;j++){
    const a=trav[i],b=trav[j];
    if(dnum(a.date)<=dnum(endOf(b))&&dnum(b.date)<=dnum(endOf(a)))pairs.push([a,b]);
  }
  if(!pairs.length)return;
  host.innerHTML=`<div class="clash-panel"><h4>⚠ ${pairs.length} scheduling overlap${pairs.length>1?'s':''} this month</h4><ul>`
    +pairs.map(p=>`<li><b>${esc(p[0].title)}</b> (${esc(fmtSpan(p[0]))}) overlaps <b>${esc(p[1].title)}</b> (${esc(fmtSpan(p[1]))})</li>`).join('')
    +`</ul></div>`;
}

/* ── STATUS TOGGLE (Possible <-> Attending) ──
   One delegated handler for every view. Local-only: see toggleBtn() and saveState(). */
document.addEventListener('click',e=>{
  const btn=e.target.closest('.status-toggle');
  if(!btn)return;
  const ev=events.find(x=>x.id===+btn.dataset.id);
  if(!ev)return;
  ev.type=ev.type==='attending'?'possible':'attending';
  activeTypes.add(ev.type);            // don't let a hidden filter swallow it
  saveState();
  flash(ev.type==='attending'?'Marked attending — in your browser only':'Moved back to possible — in your browser only');
  renderLegend();render();
});

/* ── ADD EVENT ── */
function openAdd(){
  const m=view==='month'?month:today.getMonth();
  const d=view==='month'&&selectedDay!==null?selectedDay:today.getDate();
  const safe=Math.min(d,new Date(year,m+1,0).getDate());
  document.getElementById('fDate').value=`${year}-${pad(m+1)}-${pad(safe)}`;
  document.getElementById('fEnd').value='';
  document.getElementById('fTitle').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fType').value='possible';
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),80);
}
function closeAdd(){document.getElementById('addModal').classList.remove('open');}
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('addModalClose').onclick=closeAdd;
document.getElementById('addCancel').onclick=closeAdd;
document.getElementById('addModal').onclick=e=>{if(e.target.id==='addModal')closeAdd();};
document.getElementById('addSave').onclick=()=>{
  const title=document.getElementById('fTitle').value.trim();
  const date=document.getElementById('fDate').value;
  let end=document.getElementById('fEnd').value||null;
  if(!title||!date)return;
  if(end&&dnum(end)<dnum(date))end=null;            // ignore backwards ranges
  if(end===date)end=null;
  const type=document.getElementById('fType').value;
  const ev={id:nextId++,date,title,type,notes:document.getElementById('fNotes').value.trim(),custom:true};
  if(end)ev.end=end;
  events.push(ev);
  BASE_TYPE[ev.id]=type;
  activeTypes.add(type);                             // don't add into a hidden filter
  saveState();
  closeAdd();
  flash('Event added — in your browser only');
  year=+date.slice(0,4);
  month=+date.slice(5,7)-1;
  selectedDay=null;
  renderLegend();render();
};

/* ── NAV ── */
function goYear(y){year=y;renderLegend();render();document.getElementById('scroll').scrollTo(0,0);}
document.getElementById('prevYear').onclick=()=>goYear(year-1);
document.getElementById('nextYear').onclick=()=>goYear(year+1);
document.addEventListener('keydown',e=>{
  const searchOpen=document.getElementById('searchOverlay').classList.contains('open');
  const modalOpen=document.getElementById('addModal').classList.contains('open');
  if(e.key==='Escape'){
    if(modalOpen)closeAdd();
    else if(searchOpen)closeSearch();
    else if(view==='month'&&selectedDay!==null){selectedDay=null;buildMonthGrid();renderMonthPanel();}
    return;
  }
  if(modalOpen||searchOpen)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();document.getElementById('searchInput').focus();return;}
  // ← / → step through months in month view, years everywhere else
  if(e.key==='ArrowLeft'){view==='month'?goMonth(-1):goYear(year-1);return;}
  if(e.key==='ArrowRight'){view==='month'?goMonth(1):goYear(year+1);return;}
  const k=e.key.toLowerCase();
  if(k==='m')setView('month');
  else if(k==='a')setView('agenda');
  else if(k==='y')setView('year');
  else if(k==='t')document.getElementById('todayBtn').click();
});

/* ── SEARCH ── */
function hl(text,q){
  const safe=esc(text);
  if(!q)return safe;
  const rx=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(`(${rx})`,'gi'),'<mark>$1</mark>');
}
function runSearch(q){
  q=q.trim();
  document.getElementById('searchClear').classList.toggle('visible',q.length>0);
  if(!q){closeSearch();document.getElementById('searchHint').textContent='';return;}
  const low=q.toLowerCase();
  const results=shown().filter(e=>
    e.title.toLowerCase().includes(low)||
    (e.notes&&e.notes.toLowerCase().includes(low))||
    e.date.includes(low)||(e.end&&e.end.includes(low))||
    typeLabel(e.type).toLowerCase().includes(low)||
    fmtSpan(e).toLowerCase().includes(low)||
    MONTHS[+e.date.slice(5,7)-1].toLowerCase().includes(low)
  ).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('searchHint').textContent=results.length?`${results.length} result${results.length!==1?'s':''}`:'No results';
  document.getElementById('searchLabel').innerHTML=`Results <span>for &ldquo;${esc(q)}&rdquo; &mdash; ${results.length} found</span>`;
  if(!results.length){
    document.getElementById('searchGrid').innerHTML=`<div class="search-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><h3>No results found</h3><p>Try a different keyword, date, or event type.</p></div>`;
  }else{
    document.getElementById('searchGrid').innerHTML=results.map(e=>{
      const notes=e.notes?(e.notes.length>220?e.notes.substring(0,220)+'…':e.notes):'';
      return `<div class="src-card ${e.type}" data-m="${+e.date.slice(5,7)-1}" data-y="${e.date.slice(0,4)}">`
        +`<div class="src-meta"><span class="type-tag ${e.type}">${esc(typeLabel(e.type))}</span><span class="src-date-lbl">${esc(fmtSpan(e))}</span>${spans(e)>1?`<span class="span-tag">${spans(e)} days</span>`:''}</div>`
        +`<div class="src-title">${hl(e.title,q)}</div>`
        +(notes?`<div class="src-notes">${hl(notes,q)}</div>`:'')
        +`</div>`;
    }).join('');
    document.querySelectorAll('.src-card').forEach(card=>{
      card.addEventListener('click',()=>{
        year=parseInt(card.dataset.y,10);
        month=parseInt(card.dataset.m,10);
        selectedDay=null;
        renderLegend();closeSearch();
        document.getElementById('searchInput').value='';
        document.getElementById('searchClear').classList.remove('visible');
        document.getElementById('searchHint').textContent='';
        setView('month');
      });
    });
  }
  document.getElementById('searchOverlay').classList.add('open');
}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open');}
document.getElementById('searchInput').addEventListener('input',e=>runSearch(e.target.value));
document.getElementById('searchClear').addEventListener('click',()=>{
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('visible');
  closeSearch();
  document.getElementById('searchHint').textContent='';
  document.getElementById('searchInput').focus();
});
document.getElementById('searchCloseBtn').addEventListener('click',closeSearch);

/* ── BOOT ── */
function scrollToMonth(m){const cards=document.querySelectorAll('.month');if(cards[m])cards[m].scrollIntoView({behavior:'smooth',block:'center'});}
renderLegend();
setView('month');   // opens on the current month with its events already beside it
</script>
